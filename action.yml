name: hidden-content-scan
description: Detect content a human reviewer cannot see (invisible Unicode, homoglyphs, markup that disappears when rendered)
author: kukv

inputs:
  files:
    description: Files to scan (newline separated). Defaults to every text file tracked by git
    required: false
    default: ""
  exclude:
    description: Globs to skip (comma separated), e.g. `**/testdata/**,docs/assets/*`
    required: false
    default: ""
  report-only:
    description: Rules that report without failing the job (comma separated)
    required: false
    default: "odd-space,long-line,base64-blob,private-use"
  working-directory:
    description: Directory to run the scan in
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: scan hidden content
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs are passed through env: interpolating ${{ }} inside run is an injection risk
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_REPORT_ONLY: ${{ inputs.report-only }}
        SCAN_SCRIPT: ${{ github.action_path }}/scripts/scan.py
      run: |
        set -euo pipefail

        if [ -n "$INPUT_FILES" ]; then
          printf '%s\n' "$INPUT_FILES" | sed '/^[[:space:]]*$/d' | tr '\n' '\0' > /tmp/hcs-files
        else
          # -I skips binaries; -z keeps non-ASCII file names intact
          git grep -lIz --cached '' > /tmp/hcs-files
        fi

        xargs -0 --no-run-if-empty python3 "$SCAN_SCRIPT" \
          --exclude "$INPUT_EXCLUDE" \
          --report-only "$INPUT_REPORT_ONLY" \
          --github-annotations < /tmp/hcs-files
