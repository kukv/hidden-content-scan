name: hidden-content-scan
description: Detect content a human reviewer cannot see (invisible Unicode, homoglyphs, markup that disappears when rendered)
author: kukv

inputs:
  files:
    description: Files to scan (newline separated, literal paths). Defaults to every text file tracked by git, read from the index
    required: false
    default: ""
  exclude:
    description: Globs to skip (comma separated), e.g. `**/testdata/**,docs/assets/*`. `*` stays within one directory, `**` spans directories
    required: false
    default: ""
  report-only:
    description: Rules that report without failing the job (comma separated)
    required: false
    default: "odd-space,long-line,base64-blob,private-use,invalid-utf8"
  working-directory:
    description: Directory to run the scan in
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: scan hidden content
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs are passed through env: interpolating ${{ }} inside run is an injection risk
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_REPORT_ONLY: ${{ inputs.report-only }}
        SCAN_SCRIPT: ${{ github.action_path }}/scripts/scan.py
      run: |
        set -euo pipefail

        # File names never reach argv: a name such as `--help` must not become an option
        if [ -n "$INPUT_FILES" ]; then
          list=$(mktemp "${RUNNER_TEMP:-/tmp}/hcs-files.XXXXXX")
          printf '%s\n' "$INPUT_FILES" | sed '/^[[:space:]]*$/d' | tr '\n' '\0' > "$list"
          set -- --files-from "$list"
        else
          # Read the index, not the working tree: attributes and checkout cannot change what is scanned
          set -- --git-index
        fi

        # -I keeps PYTHONPATH and files in the scanned checkout from shadowing the standard library
        python3 -I "$SCAN_SCRIPT" \
          --exclude "$INPUT_EXCLUDE" \
          --report-only "$INPUT_REPORT_ONLY" \
          --github-annotations "$@"
